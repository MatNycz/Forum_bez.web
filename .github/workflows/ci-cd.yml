name: CI/CD + Security - MiniForum

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: Forum-RG
  ACR_NAME: miniforumpwr2026
  CONTAINER_APP_NAME: miniforum-app
  IMAGE: miniforumpwr2026.azurecr.io/miniforum-app
  PYTHON_VERSION: "3.11"

jobs:
  # Skanowanie sekretów (Gitleaks)
  secrets-scan:
    name: 1a. Skan sekretów (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST (Bandit) + SCA (pip-audit)
  sast-sca:
    name: 1b. SAST (Bandit) + SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit pip-audit
      - name: Bandit (SAST)
        run: bandit -r app/ -ll -ii
      - name: pip-audit (SCA)
        run: pip-audit -r requirements.txt

  # Testy jednostkowe
  test:
    name: 1c. Testy (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - run: PYTHONPATH=. pytest tests/

  # Skan obrazu kontenera (Trivy) + wdrożenie (klucz w GitHub Secrets)
  build-scan-deploy:
    name: 2. Build, Trivy, wdrożenie do Azure
    needs: [secrets-scan, sast-sca, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      app_url: ${{ steps.url.outputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build obrazu
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Trivy - raport HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH

      - name: Trivy - bramka CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Logowanie do Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Push do ACR
        run: |
          az acr login --name $ACR_NAME
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Aktualizacja Azure Container Apps
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --image $IMAGE:${{ github.sha }}

      - name: Adres aplikacji dla DAST
        id: url
        run: |
          FQDN=$(az containerapp show -n $CONTAINER_APP_NAME -g $AZURE_RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Adres aplikacji: https://$FQDN"
          echo "app_url=https://$FQDN" >> $GITHUB_OUTPUT

  # DAST (OWASP ZAP)
  dast:
    name: 3. DAST (OWASP ZAP baseline)
    needs: build-scan-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.APP_URL || needs.build-scan-deploy.outputs.app_url }}
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-a'
