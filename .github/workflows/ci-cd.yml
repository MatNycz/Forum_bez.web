name: CI/CD + Security - MiniForum

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: Forum-RG
  ACR_NAME: miniforumpwr2026
  CONTAINER_APP_NAME: miniforum-app
  IMAGE: miniforumpwr2026.azurecr.io/miniforum-app
  PYTHON_VERSION: "3.11"

jobs:
  # Skanowanie sekretów (Gitleaks)
  secrets-scan:
    name: 1a. Skan sekretów (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST (Bandit -> Security tab) + SCA (pip-audit -> artefakt)
  sast-sca:
    name: 1b. SAST (Bandit) + SCA (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "bandit[sarif]" pip-audit

      - name: Bandit (SAST)
        run: bandit -r app/ -ll -ii -f sarif -o bandit.sarif

      - name: Upload Bandit do Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: pip-audit (SCA)
        if: always()
        run: |
          set +e
          pip-audit -r requirements.txt -f markdown -o pip-audit.md
          rc=$?
          cat pip-audit.md
          exit $rc

      - name: Upload raportu pip-audit
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pip-audit-report
          path: pip-audit.md

  # Testy jednostkowe
  test:
    name: 1c. Testy (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - run: PYTHONPATH=. pytest tests/

  # Skan obrazu kontenera (Trivy -> Security tab) + wdrożenie (klucz w GitHub Secrets)
  build-scan-deploy:
    name: 2. Build, Trivy, wdrożenie do Azure
    needs: [secrets-scan, sast-sca, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Build obrazu
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .

      - name: Trivy - raport SARIF (MEDIUM + HIGH + CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: true

      - name: Upload Trivy do Code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Trivy - bramka CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Logowanie do Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Push do ACR
        run: |
          az acr login --name $ACR_NAME
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Aktualizacja Azure Container Apps
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --image $IMAGE:${{ github.sha }}

  # DAST (OWASP ZAP -> artefakt z raportem HTML)
  dast:
    name: 3. DAST (OWASP ZAP baseline)
    needs: build-scan-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: chmod a+w .

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.APP_URL }}
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-a'

      - name: Upload raportu ZAP
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
