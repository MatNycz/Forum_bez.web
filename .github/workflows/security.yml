name: Security Checks (L6)

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

permissions:
  contents: read

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. SAST - Analiza statyczna kodu (Bandit przez pip)
      - name: Set up Python for Bandit
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r app/ -ll

      # 2. Skanowanie Sekretów (Gitleaks)
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""

      # 3. Skanowanie Zależności / SCA (pip-audit)
      - name: Install dependencies for audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit (SCA)
        run: pip-audit -r requirements.txt

      # 4. Skanowanie Obrazu Dockera (Trivy)
      - name: Build Docker image
        run: docker build -t forum-app:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'forum-app:latest'
          format: 'table'
          exit-code: '0'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'